name: CI/CD Pipeline - Epros ERP

# - pull_request: gate antes do merge
# - push em main/develop: push direto (hotfix etc.)
# - workflow_dispatch: reexecução manual
# Merge via UI do GitHub (committer web-flow) NÃO reexecuta — o PR já validou.
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-sast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow')
    runs-on: ubuntu-latest
    # Suite completa costuma < 10 min; 20 min evita runner preso por hang.
    timeout-minutes: 20

    # Postgres gerenciado pelo Actions (sem Testcontainers/Docker-in-Docker no job).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epros
          POSTGRES_PASSWORD: epros
          POSTGRES_DB: epros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epros -d epros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore -warnaserror

    - name: Run Unit & Integration Tests
      timeout-minutes: 15
      env:
        # Bypass Testcontainers — usa o service container acima.
        EPROS_TEST_PG: Host=localhost;Port=5432;Username=epros;Password=epros;Database=epros
        TESTCONTAINERS_RYUK_DISABLED: true
      run: >
        dotnet test --configuration Release --no-build --verbosity normal
        --blame-hang --blame-hang-timeout 10m

  security-sast:
    name: Security SAST & Secrets Scan
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow')
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Run Trivy Vulnerability Scan (High & Critical)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        severity: 'HIGH,CRITICAL'
