name: CI/CD Pipeline - Epros ERP

# - pull_request: gate antes do merge
# - push em main/develop: push direto (hotfix etc.)
# - workflow_dispatch: reexecução manual
# Merge via UI do GitHub (committer web-flow) NÃO reexecuta — o PR já validou.
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-sast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow')
    runs-on: ubuntu-latest
    # Suite completa costuma < 10 min; 20 min evita runner preso por hang de Testcontainers/xUnit.
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore -warnaserror

    # Falha cedo se o registry/Docker estiver ruim (em vez de pendurar no StartAsync do Testcontainers).
    - name: Pre-pull Postgres (Testcontainers)
      run: docker pull postgres:16-alpine
      timeout-minutes: 5

    - name: Run Unit & Integration Tests
      timeout-minutes: 15
      env:
        # Ryuk às vezes atrasa/limpa cedo em runners efêmeros; o job já isola o ambiente.
        TESTCONTAINERS_RYUK_DISABLED: true
      run: >
        dotnet test --configuration Release --no-build --verbosity normal
        --blame-hang --blame-hang-timeout 5m

  security-sast:
    name: Security SAST & Secrets Scan
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow')
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Run Trivy Vulnerability Scan (High & Critical)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        severity: 'HIGH,CRITICAL'
