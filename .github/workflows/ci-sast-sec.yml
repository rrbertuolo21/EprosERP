name: CI/CD Pipeline - Epros ERP

# Só no PR (gate antes do merge). Evita segunda execução no push após merge.
# workflow_dispatch: reexecução manual quando necessário.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-sast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Verify Code Formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore -warnaserror

    - name: Run Unit & Integration Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

  security-sast:
    name: Security SAST & Secrets Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Run Trivy Vulnerability Scan (High & Critical)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        ignore-unfixed: true
        format: 'table'
        severity: 'HIGH,CRITICAL'
