server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Redirects relativos: sem isso o 301 de diretório ($uri/) reescreve para
  # http://host:80 e perde a porta publicada (:3000) → deep-link/F5 quebra.
  absolute_redirect off;
  port_in_redirect off;
  # SPA: rotas do Nuxt (ssr:false) caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
